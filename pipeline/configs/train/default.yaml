---
defaults:
  - _self_

data_root: ${dataset.workdir}
epochs: 100
val_freq: 10
gradient_clip_val: 1.0
device: auto  # Lightning accelerator: auto, cpu, mps, gpu
max_state_dim: 16
max_action_dim: 5
max_endogenous_dim: 16
max_model_params_dim: 36  # >= the largest model's parameter count
max_seq_len: 50

model:
  _target_: lib.models.transformer.AlgorithmDistillationTransformer
  state_dim: ${train.max_state_dim}
  action_dim: ${train.max_action_dim}
  pinn_output_dim: ${train.max_endogenous_dim}
  d_model: 48  # task_embedding dim is d_model - model_params_dim
  num_layers: 2
  nhead: 4
  max_seq_len: ${train.max_seq_len}
  model_params_dim: ${train.max_model_params_dim}
  has_pinn: true
  context_only: true  # hide the task id and the model parameters
  input_normalization: causal  # symlog | causal (scale-free; inference() then needs initial_action)
optimizer:
  _target_: torch.optim.Adam
  lr: 1.0e-4  # peak, after warmup (symlog inputs need 3.0e-5)
  weight_decay: 0.01
  betas: [0.9, 0.98]
scheduler:  # per-step linear warmup, then cosine decay to eta_min
  warmup_steps: 200
  eta_min: 3.0e-6
loss:
  _target_: torch.nn.MSELoss
  reduction: mean
