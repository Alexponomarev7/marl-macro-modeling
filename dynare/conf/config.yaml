        data_path: ./data/interim/Born_Pfeifer_2018_MP


  Caldara_et_al_2012:
    dynare_model_settings:
      periods: ${metadata.periods}
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 1.0  # actual = int(base * coefficient)
      parameter_ranges:
        beta: [0.985, 0.995]
        zeta_capital: [0.25, 0.35]
        delta_depreciation: [0.015, 0.025]
        rho_technology: [0.90, 0.98]
        eis: [0.3, 0.7]
        gamma_risk: [3.0, 15.0]
        rho_volatility: [0.85, 0.95]
        sigma_bar: [-4.5, -3.5]
        eta_volatility: [0.04, 0.10]
        technology_shock_stderr: [0.8, 1.2]
        volatility_shock_stderr: [0.8, 1.2]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.epstein_zin_utility
      reward_kwargs:
        consumption_column: Consumption
        labor_column: Labor
      input:
        state_columns:
          - [Capital, -1]
          - LoggedProductivity
          - LoggedVolatility
        action_columns:
          - Consumption
          - Labor
        endogenous_columns:
          - Output
          - Investment
          - ValueFunction
          - ExpectedSDF
          - ExpectedReturnCapital
          - RiskFreeRate
      output:
        data_path: ./data/interim/Caldara_et_al_2012


  Collard_2001:
    dynare_model_settings:
      periods: ${metadata.periods}
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 1.0  # actual = int(base * coefficient)
      parameter_ranges:
        alpha: [0.30, 0.42]
        beta: [0.97, 0.995]
        delta: [0.02, 0.04]
        psi: [0.0, 1.0]
        rho: [0.90, 0.98]
        tau: [0.01, 0.05]
        phi: [0.05, 0.20]
        h_ss_target: [0.25, 0.40]
        technology_shock_stderr: [0.005, 0.015]
        preference_shock_stderr: [0.005, 0.015]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.separable_utility_reward
      reward_kwargs:
        consumption_column: Consumption
        labor_column: Labor
        labor_form: power
        labor_weight_column: sigma
        frisch_column: psi
      input:
        state_columns:
          - [Capital, -1]
          - TechnologyShock
          - PreferenceShock
        action_columns:
          - Consumption
          - Labor
        endogenous_columns:
          - Output
      output:
        data_path: ./data/interim/Collard_2001


  Faia_2008:
    dynare_model_settings:
      periods: ${metadata.periods}
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 1.0  # actual = int(base * coefficient)
      parameter_ranges:
        beta: [0.9, 0.995]
        sigma: [1.5, 3.0]
        epsilon: [5.0, 11.0]
        psi_p: [30.0, 80.0]
        xi: [0.3, 0.5]
        rho_sep: [0.05, 0.12]
        varsigma: [0.4, 0.6]
        b_w_target: [0.4, 0.6]
        lambda_w: [0.4, 0.8]
        g_share: [0.1, 0.5]
        rho_z: [0.90, 0.98]
        rho_g: [0.85, 0.95]
        stderr_z: [0.005, 0.02]
        stderr_g: [0.005, 0.02]

    rl_env_settings:
      discount_factor_param: beta
      # stability_reward just returns target_column verbatim - applied to InflationRate that
      # rewards maximizing inflation forever, not stabilizing it. Faia_2008.mod declares no
      # output-gap variable, so central_bank_loss's y_gap term is disabled (inflation-only loss).
      reward: lib.rewards.central_bank_loss
      reward_kwargs:
        inflation_column: InflationRate
        output_gap_column: null
      input:
        state_columns:
          - [Employment, -1]
          - [Vacancies, -1]
          - [MeetingRate, -1]
          - [NominalInterestRate, -1]
          - [GrossOutputB, -1]
          - LogTFP
          - GovernmentSpendingShock
        action_columns:
          - NominalInterestRate
        endogenous_columns:
          - LagrangeMultiplierA
          - LagrangeMultiplierB
          - MarketTightness
          - Matches
          - GrossOutputA
          - GovernmentSpending
          - LogOutput
          - LogVacancies
          - LogWages
          - LogUnemployment
          - LogTightnessA
          - LogTightnessB
      output:
        data_path: ./data/interim/Faia_2008


  Faia_Monacelli_2008:
    dynare_model_settings:
      periods: ${metadata.periods}
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 1.0  # actual = int(base * coefficient)
      parameter_ranges:
        beta: [0.98, 0.995]
        sigma: [1.0, 3.0]
        phi: [1.0, 5.0]
        eta: [0.5, 2.0]
        gamma_h: [0.5, 0.9]
        epsilon: [5.0, 11.0]
        psi_p: [30.0, 100.0]
        rho_a: [0.8, 0.95]
        rho_ystar: [0.8, 0.95]
        rho_pistar: [0.3, 0.7]
        phi_pi: [1.2, 2.5]
        phi_y: [0.0, 0.5]
        stderr_a: [0.005, 0.02]
        stderr_ystar: [0.005, 0.02]
        stderr_pistar: [0.002, 0.01]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.soe_welfare_reward
      reward_kwargs:
        consumption_column: Consumption
        labor_column: Labor
        sigma_column: sigma
        phi_column: phi
        sigma_default: 1.0
        phi_default: 3.0
      input:
        state_columns:
          - [TermsOfTrade, -1]
          - [PriceRatioH, -1]
          - LogProductivity
          - OutputForeign
          - InflationForeign
        action_columns:
          - NominalInterestRate
        endogenous_columns:
          - InflationH
          - ConsumptionH
          - ConsumptionF
          - Labor
          - Wage
          - Lambda
          - RealInterestRate
          - DepreciationRate
          - Productivity
          - ConsumptionForeign
          - LogOutput
          - LogConsumption
          - LogRealExchangeRate
          - LogTermsOfTrade
          - LogInflationH
      output:
        data_path: ./data/interim/Faia_Monacelli_2008


