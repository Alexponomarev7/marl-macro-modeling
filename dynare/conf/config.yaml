metadata:
  data_folder: data
  periods: 1000
  num_samples: 6000
  seed: null  # set an int for a reproducible dataset (parameter draws + Dynare shock seeds)
  only_models: null  # e.g. metadata.only_models=[Hansen_1985,SGU_2004] to run a subset
  resume: false  # true: keep draws already written to data_folder/raw, generate the rest

models:

  Ramsey_base:
    dynare_model_settings:
      periods: 200
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 1.0  # actual = int(base * coefficient)
      column_names:
        - Consumption
        - Capital
        - Output
        - Investment
      parameter_ranges:
        start_capital_ratio: [0.3, 1.7]
        alpha: [0.28, 0.40]
        beta: [0.95, 0.99]
        delta: [0.02, 0.15]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.log_reward
      reward_kwargs:
        target_column: Consumption
      input:
        state_columns:
          - [Capital, -1]
          - Output
        action_columns:
          - Consumption
        endogenous_columns:
          - Investment
      output:
        data_path: ./data/interim/Ramsey_base


  Ramsey_crra:
    dynare_model_settings:
      periods: 250
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 0.5  # actual = int(base * coefficient)
      column_names:
        - ConsumptionPerCapita
        - CapitalPerCapita
        - OutputPerCapita
        - InvestmentPerCapita
      parameter_ranges:
        start_capital_ratio: [0.3, 1.7]
        start_labor: [1.0, 1.0]
        alpha: [0.28, 0.40]
        beta: [0.95, 0.99]
        delta: [0.02, 0.15]
        sigma: [0.5, 3.0]
        n: [0.0, 0.02]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.crra_reward
      reward_kwargs:
        target_column: ConsumptionPerCapita
        sigma_column: sigma
      input:
        state_columns:
          - [CapitalPerCapita, -1]
          - OutputPerCapita
          # Labor here is the raw population level (Labor_t = (1+n)*Labor_{t-1}, .mod's own
          # equation), not a decision-relevant quantity - deterministic given t and n, and it
          # explodes to 1e6-1e7+ over periods=1000 while every other state stays O(1-100),
          # dwarfing them for the model. Dropped; per-capita vars already normalize it out.
        action_columns:
          - ConsumptionPerCapita
        endogenous_columns:
          - InvestmentPerCapita
      output:
        data_path: ./data/interim/Ramsey_crra


  Ramsey_cara:
    dynare_model_settings:
      periods: 300
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 0.5  # actual = int(base * coefficient)
      column_names:
        - ConsumptionPerCapita
        - CapitalPerCapita
        - OutputPerCapita
        - InvestmentPerCapita
      parameter_ranges:
        start_capital_ratio: [0.3, 1.7]
        start_labor: [1.0, 1.0]
        alpha: [0.28, 0.40]
        beta: [0.95, 0.99]
        delta: [0.02, 0.15]
        sigma: [0.5, 3.0]
        n: [0.0, 0.02]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.cara_reward
      reward_kwargs:
        target_column: ConsumptionPerCapita
        sigma_column: sigma
      input:
        state_columns:
          - [CapitalPerCapita, -1]
          - OutputPerCapita
          # Labor dropped - see the same note in Ramsey_crra above (raw population level,
          # explodes to 1e6-1e7+ over periods=1000, not decision-relevant).
        action_columns:
          - ConsumptionPerCapita
        endogenous_columns:
          - InvestmentPerCapita
      output:
        data_path: ./data/interim/Ramsey_cara


  Ramsey_upgrade:
    dynare_model_settings:
      periods: 150
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 0.35  # actual = int(base * coefficient)
      parameter_ranges:
        start_capital_ratio: [0.3, 1.7]
        alpha: [0.28, 0.40]
        beta: [0.95, 0.99]
        delta: [0.02, 0.15]
        sigma: [0.5, 3.0]
        n: [0.0, 0.02]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.crra_reward
      reward_kwargs:
        # Per-effective-labor (stationary), matching action_columns/state_columns below.
        # ConsumptionPerCapita grows unboundedly with Technology (g=0.02/period compounded
        # over periods=1000 => ~10^8x by episode end) and would blow up the reward scale.
        target_column: ConsumptionPerEffectiveLabor
        sigma_column: sigma
      input:
        state_columns:
          - [CapitalPerEffectiveLabor, -1]
          # Productivity and Labor dropped: Ramsey_upgrade.mod's Technology/Labor are raw
          # levels (Technology_t=(1+g)*Technology_{t-1}, Labor_t=(1+n)*Labor_{t-1}, no
          # logged/per-capita variant declared for either), both exploding to 1e5-1e8+ over
          # periods=1000 - deterministic given t/g/n, not decision-relevant, and swamps the
          # scale of every genuinely stationary state variable.
          - InterestRate
        action_columns:
          - ConsumptionPerEffectiveLabor
        endogenous_columns:
          - OutputPerEffectiveLabor
          - InvestmentPerEffectiveLabor
          - MarginalProductCapital
          - WagePerEffectiveLabor
      output:
        data_path: ./data/interim/Ramsey_upgrade


  OLG:
    dynare_model_settings:
      periods: ${metadata.periods}
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 1.0  # actual = int(base * coefficient)
      parameter_ranges:
        alpha: [0.3, 0.4]
        beta: [0.4, 0.6]  # discounting between youth and old age (one period ~ a generation)
        delta: [0.8, 0.9]  # generational depreciation
        n: [0.05, 0.1]  # population growth per generation
        g: [0.2, 0.3]  # technology growth per generation
        sigma: [0.5, 3.0]  # CRRA curvature
        rho_z: [0.0, 0.5]  # generational TFP persistence
        productivity_shock_stderr: [0.05, 0.15]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.olg_lifetime_utility_reward
      reward_kwargs:
        consumption_young_column: ConsYoung
        consumption_old_column: ConsOld
        beta_column: beta
        sigma_column: sigma
      input:
        state_columns:
          - [Capital, -1]
          - LoggedProductivity
          - Output
          - Wage
          - InterestRate
        action_columns:
          - Savings
        endogenous_columns:
          - ConsYoung
          - ConsOld
      output:
        data_path: ./data/interim/OLG


  RBC_baseline_pf:
    dynare_model_settings:
      periods: 300
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 0.75  # actual = int(base * coefficient)
      parameter_ranges:
        start_capital_ratio: [0.7, 1.3]
        alpha: [0.28, 0.40]
        beta: [0.95, 0.99]
        delta: [0.02, 0.05]
        rho: [0.7, 0.9]
        sigma: [0.5, 3.0]
      shocks:
        productivity:
          num_shocks: 4
          period_range: [10, 90]
          value_range: [-0.1, 0.1]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.crra_reward
      reward_kwargs:
        target_column: Consumption
        sigma_column: sigma
      input:
        state_columns:
          - [Capital, -1]
          - LoggedProductivity
          - Productivity
        action_columns:
          - Consumption
        endogenous_columns:
          - Output
          - Investment
          - InterestRate
      output:
        data_path: ./data/interim/RBC_baseline_pf


  RBC_baseline_stoch:
    dynare_model_settings:
      periods: ${metadata.periods}
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 0.75  # actual = int(base * coefficient)
      parameter_ranges:
        alpha: [0.28, 0.40]
        beta: [0.95, 0.99]
        delta: [0.02, 0.05]
        rho: [0.7, 0.9]
        sigma: [0.5, 3.0]
        productivity_shock_stderr: [0.005, 0.03]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.crra_reward
      reward_kwargs:
        target_column: Consumption
        sigma_column: sigma
      input:
        state_columns:
          - [Capital, -1]
          - LoggedProductivity
          - Productivity
        action_columns:
          - Consumption
        endogenous_columns:
          - Output
          - Investment
          - InterestRate
      output:
        data_path: ./data/interim/RBC_baseline_stoch


  RBC_capital_stock_shock_pf:
    dynare_model_settings:
      periods: 250
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 0.5  # actual = int(base * coefficient)
      parameter_ranges:
        start_capital_ratio: [0.7, 1.3]
        alpha: [0.28, 0.40]
        beta: [0.95, 0.99]
        delta: [0.02, 0.05]
        rho: [0.7, 0.9]
        sigma: [1.0, 2.0]
        l_ss_target: [0.30, 0.40]
      shocks:
        productivity:
          num_shocks: 4
          period_range: [20, 80]
          value_range: [-0.1, 0.1]
        capital:
          num_shocks: 2
          period_range: [20, 80]
          value_range: [0.01, 0.15]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.ces_utility_reward
      reward_kwargs:
        consumption_column: Consumption
        labor_column: Labor
        sigma_column: sigma
        A_column: psi
        eta_default: 1.0
        sigma_default: 1.0
      input:
        state_columns:
          - [Capital, -1]
          - LoggedProductivity
          - Productivity
          - CapitalDestruction
        action_columns:
          - Consumption
          - Labor
        endogenous_columns:
          - Investment
          - Output
          - Wage
          - InterestRate
      output:
        data_path: ./data/interim/RBC_capital_stock_shock_pf


  RBC_capital_stock_shock_stoch:
    dynare_model_settings:
      periods: ${metadata.periods}
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 0.5  # actual = int(base * coefficient)
      parameter_ranges:
        alpha: [0.3, 0.34]
        beta: [0.95, 0.99]
        delta: [0.02, 0.05]
        rho: [0.7, 0.9]
        sigma: [1.0, 2.0]
        l_ss_target: [0.30, 0.40]
        productivity_shock_stderr: [0.005, 0.03]
        capital_shock_stderr: [0.005, 0.02]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.ces_utility_reward
      reward_kwargs:
        consumption_column: Consumption
        labor_column: Labor
        sigma_column: sigma
        A_column: psi
        eta_default: 1.0
        sigma_default: 1.0
      input:
        state_columns:
          - [Capital, -1]
          - LoggedProductivity
          - Productivity
          - CapitalDestruction
        action_columns:
          - Consumption
          - Labor
        endogenous_columns:
          - Investment
          - Output
          - Wage
          - InterestRate
      output:
        data_path: ./data/interim/RBC_capital_stock_shock_stoch


  RBC_news_shock_model_pf:
    dynare_model_settings:
      periods: ${metadata.periods}
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 0.5  # actual = int(base * coefficient)
      parameter_ranges:
        alpha: [0.30, 0.40]
        sigma: [0.5, 2.0]
        n: [0.001, 0.004]
        x: [0.003, 0.008]
        i_y: [0.18, 0.28]
        k_y: [8.0, 12.0]
        rhoz: [0.90, 0.99]
        l_ss_target: [0.28, 0.38]
        start_capital_ratio: [0.7, 1.3]
      shocks:
        news:
          num_shocks: 3
          period_range: [10, 70]
          value_range: [-0.03, 0.03]
        surprise:
          num_shocks: 2
          period_range: [20, 80]
          value_range: [-0.05, 0.05]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.ces_utility_reward
      reward_kwargs:
        consumption_column: Consumption
        labor_column: Labor
        sigma_column: sigma
        A_column: psi
        eta_default: 1.0
        # RBC_news_shock_model_pf.mod stores Consumption/Labor as their (log), not the level -
        # C**(1-sigma) on a raw log value is negative-base/NaN roughly half the time.
        log_inputs: true
      input:
        state_columns:
          - [LoggedCapital, -1]
          - LoggedProductivity
          - TFPNews8
          - TFPNews7
          - TFPNews6
          - TFPNews5
          - TFPNews4
          - TFPNews3
          - TFPNews2
          - TFPNews1
        action_columns:
          - LoggedConsumption
          - LoggedLabor
        endogenous_columns:
          - LoggedOutput
          - LoggedInvestment
          - LoggedWage
          - AnnualInterestRate
      output:
        data_path: ./data/interim/RBC_news_shock_pf


  RBC_news_shock_model_stoch:
    dynare_model_settings:
      periods: ${metadata.periods}
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 0.5  # actual = int(base * coefficient)
      parameter_ranges:
        alpha: [0.30, 0.40]
        sigma: [0.5, 2.0]
        n: [0.001, 0.004]
        x: [0.003, 0.008]
        i_y: [0.18, 0.28]
        k_y: [8.0, 12.0]
        rhoz: [0.90, 0.99]
        l_ss_target: [0.28, 0.38]
        news_shock_stderr: [0.005, 0.02]
        surprise_shock_stderr: [0.005, 0.02]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.ces_utility_reward
      reward_kwargs:
        consumption_column: Consumption
        labor_column: Labor
        sigma_column: sigma
        A_column: psi
        eta_default: 1.0
        log_inputs: True
      input:
        state_columns:
          - [LoggedCapital, -1]
          - LoggedProductivity
          - TFPNews8
          - TFPNews7
          - TFPNews6
          - TFPNews5
          - TFPNews4
          - TFPNews3
          - TFPNews2
          - TFPNews1
        action_columns:
          - LoggedConsumption
          - LoggedLabor
        endogenous_columns:
          - LoggedOutput
          - LoggedInvestment
          - LoggedWage
          - AnnualInterestRate
      output:
        data_path: ./data/interim/RBC_news_shock_stoch


  RBC_state_dependent_GIRF_household:
    dynare_model_settings:
      periods: ${metadata.periods}
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 0.5  # actual = int(base * coefficient)
      parameter_ranges:
        alpha: [0.30, 0.40]
        sigma: [0.5, 2.0]
        n: [0.001, 0.004]
        x: [0.003, 0.008]
        i_y: [0.18, 0.28]
        k_y: [8.0, 12.0]
        rho: [0.7, 0.9]
        rho_g: [0.90, 0.99]
        gshare: [0.15, 0.30]
        productivity_shock_stderr: [0.005, 0.010]
        gov_spending_shock_stderr: [0.008, 0.015]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.ces_utility_reward
      reward_kwargs:
        consumption_column: Consumption
        labor_column: Labor
        sigma_column: sigma
        A_column: psi
      input:
        state_columns:
          - [Capital, -1]
          - LoggedProductivity
          - LoggedGovSpending
        action_columns:
          - Consumption
          - Labor
        endogenous_columns:
          - Output
          - Investment
          - GovSpending
          - Wage
          - InterestRate
      output:
        data_path: ./data/interim/RBC_state_dependent_GIRF_household


  RBC_state_dependent_GIRF_government:
    dynare_model_settings:
      periods: ${metadata.periods}
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 0.5  # actual = int(base * coefficient)
      parameter_ranges:
        alpha: [0.30, 0.40]
        sigma: [0.5, 2.0]
        n: [0.001, 0.004]
        x: [0.003, 0.008]
        i_y: [0.18, 0.28]
        k_y: [8.0, 12.0]
        rho: [0.7, 0.9]
        rho_g: [0.90, 0.99]
        gshare: [0.15, 0.30]
        productivity_shock_stderr: [0.005, 0.010]
        gov_spending_shock_stderr: [0.008, 0.015]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.government_welfare
      reward_kwargs:
        consumption_column: Consumption
        labor_column: Labor
        output_column: Output
        gov_spending_column: GovSpending
        sigma_column: sigma
        lambda_utility: 1.0
        lambda_output_gap: 0.1
        lambda_smoothing: 0.05
      input:
        state_columns:
          - [Capital, -1]
          - LoggedProductivity
          - Output
          - Consumption
          - Labor
        action_columns:
          - GovSpending
        endogenous_columns:
          - LoggedGovSpending
          - Investment
          - Wage
          - InterestRate
      output:
        data_path: ./data/interim/RBC_state_dependent_GIRF_government


  Aguiar_Gopinath_2007:
    dynare_model_settings:
      periods: ${metadata.periods}
      num_samples:
        base: ${metadata.num_samples}
        coefficient: 1.0  # actual = int(base * coefficient)
      parameter_ranges:
        beta: [0.95, 0.99]                            # Discount rate (beta)
        sigma: [1.5, 2.0]                             # Risk aversion (sigma)
        persistence_trend_growth: [0.0, 0.3]  # Persistence of trend growth shock (rho_G; paper: 0.01)
        persistence_productivity: [0.7, 0.95]         # Persistence of productivity (rho_A)
        # Aguiar_Gopinath_2007.mod's production function is Capital^(1-capital_share) * Labor^capital_share
        # (capital_share is applied to LABOR, matching its own default of 0.68 -> capital gets 1-0.68=0.32,
        # standard). Sampling capital_share directly in [0.3, 0.4] as if it were capital's own exponent
        # inverted this: capital would get 0.6-0.7 of output and labor 0.3-0.4, backwards from calibration.
        capital_share: [0.6, 0.7]                     # Applied as labor's exponent; capital gets 1-this ~ [0.3, 0.4]
        labor_share: [0.3, 0.4]                       # Separate Cobb-Douglas utility weight (consumption vs. leisure), unrelated to production
        depreciation: [0.02, 0.05]                    # Depreciation rate (delta)
        capital_adjustment_cost: [2.0, 6.0]           # Capital adjustment cost (phi_K)
        debt_elastic_premium: [0.0005, 0.002]  # Debt-elastic interest rate premium (psi)
        debt_share: [0.05, 0.15]                      # Debt share (alpha_D)
        trend_growth_shock_stderr: [0.02, 0.04]  # Std dev of trend growth shock
        shock_productivity_stderr: [0.003, 0.006]     # Std dev of productivity shock

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.stability_reward
      reward_kwargs:
        target_column: Utility
      input:
        state_columns:
          - [Capital, -1]
          - [Debt, -1]
          - Productivity
          - TrendGrowthShock
        action_columns:
          - Consumption
          - Labor
        endogenous_columns:
          - Output
          - Investment
          - BondPrice
          - NetExports
          - Utility
      output:
        data_path: ./data/interim/Aguiar_Gopinath_2007


  GarciaCicco_2010:
