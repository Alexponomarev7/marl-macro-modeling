      parameter_ranges:
        alpha: [0.30, 0.35]
        beta: [0.90, 0.95]
        gamma_c: [1.5, 2.5]
        delta: [0.10, 0.15]
        psi: [0.0005, 0.002]
        omega: [1.4, 1.8]
        phi: [2.5, 4.0]
        d_ss: [0.005, 0.01]
        g_ss: [1.003, 1.007]
        rho_a: [0.70, 0.85]
        rho_g: [0.75, 0.90]
        rho_nu: [0.80, 0.90]
        rho_mu: [0.85, 0.95]
        productivity_shock_stderr: [0.020, 0.035]
        tech_growth_shock_stderr: [0.020, 0.035]
        preference_shock_stderr: [0.0, 0.0]
        country_premium_shock_stderr: [0.0, 0.0]

    rl_env_settings:
      discount_factor_param: beta
      reward: lib.rewards.GarciaCicco
      reward_kwargs:
        consumption_column: Consumption
        labor_column: Labor
        preference_shock_column: PreferenceShock
        gamma_column: gamma_c
        theta_column: theta
        omega_column: omega
      input:
        state_columns:
          - [Capital, -1]
          - [Debt, -1]
          - LoggedProductivity
          - TechGrowthRate
        action_columns:
          - Consumption
          - Labor
        endogenous_columns:
          - Output
          - Investment
          - TradeBalance
          - InterestRate
          - MUConsumption
          - TradeBalanceToOutput
          - OutputGrowth
          - ConsumptionGrowth
          - InvestmentGrowth
